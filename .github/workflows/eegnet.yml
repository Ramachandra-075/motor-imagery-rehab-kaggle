name: Validate raw EEGNet
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/eegnet.yml"
      - "scripts/eegnet.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install kaggle numpy pandas scipy scikit-learn torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: |
          mkdir -p data
          kaggle competitions download -c low-cost-motor-imagery-decoding-for-rehab -p data
      - run: python scripts/eegnet.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eegnet-validation
          path: output/eegnet.json
          if-no-files-found: warn
          retention-days: 14
