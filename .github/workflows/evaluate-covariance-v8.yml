name: Evaluate covariance V8 candidate
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluate-covariance-v8.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install kaggle numpy pandas scipy scikit-learn
      - run: |
          mkdir -p data
          kaggle competitions download -c low-cost-motor-imagery-decoding-for-rehab -p data
      - run: python scripts/covariance_v8.py
      - uses: actions/upload-artifact@v4
        with:
          name: eeg-covariance-v8-evaluation
          path: output/
          retention-days: 30
