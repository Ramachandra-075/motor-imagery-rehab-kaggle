name: Evaluate improved submission on Kaggle
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluate-v2.yml"
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install kaggle numpy pandas scipy scikit-learn
      - run: |
          mkdir -p data
          kaggle competitions download -c low-cost-motor-imagery-decoding-for-rehab -p data
      - run: python scripts/submit_v2.py
      - name: Submit selected model
        run: kaggle competitions submit -c low-cost-motor-imagery-decoding-for-rehab -f output/submission.csv -m "V2 filtered EEG full and split bandpower"
      - name: Show Kaggle submission status
        if: always()
        run: kaggle competitions submissions -c low-cost-motor-imagery-decoding-for-rehab -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submitted-eeg-v2
          path: output/
          if-no-files-found: warn
          retention-days: 30
