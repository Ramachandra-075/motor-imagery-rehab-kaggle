name: Build and evaluate pre-cue EEG V3
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/evaluate-v3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install kaggle numpy pandas scipy scikit-learn
      - run: |
          mkdir -p data
          kaggle competitions download -c low-cost-motor-imagery-decoding-for-rehab -p data
      - run: python scripts/submit_v3.py
      - name: Validate format
        run: |
          python - <<'PY'
          import csv
          with open('output/submission.csv', newline='') as stream:
              reader = csv.DictReader(stream)
              assert reader.fieldnames == ['ID', 'TARGET']
              rows = list(reader)
          assert len(rows) == 680
          assert all(row['ID'] == str(i) and row['TARGET'] in ('move', 'rest') for i, row in enumerate(rows))
          print('Validated 680 predictions')
          PY
      - run: kaggle competitions submit -c low-cost-motor-imagery-decoding-for-rehab -f output/submission.csv -m "V3 common-average EEG pre-cue baseline and temporal bandpower"
      - run: kaggle competitions submissions -c low-cost-motor-imagery-decoding-for-rehab -v | head -n 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eeg-v3-submission
          path: output/
          if-no-files-found: warn
          retention-days: 30
