name: Inspect current EEG leaderboard
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/leaderboard.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install kaggle
      - run: kaggle competitions leaderboard -c low-cost-motor-imagery-decoding-for-rehab -s -v | head -n 30
