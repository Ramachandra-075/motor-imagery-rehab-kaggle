name: Inspect public EEG notebooks
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-notebooks.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install kaggle
      - run: kaggle kernels list --competition low-cost-motor-imagery-decoding-for-rehab --sort-by voteCount -v | head -n 25
