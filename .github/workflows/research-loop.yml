name: Continuous EEG research loop (no Kaggle submissions)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/research-loop.yml"
      - "scripts/nonlinear_v9.py"
      - "scripts/research_grid.py"
      - "scripts/riemann_research.py"
      - "scripts/submit_v9.py"

permissions:
  contents: read

concurrency:
  group: eeg-research-grid-loop
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EEG research dependencies
        run: python -m pip install kaggle numpy pandas scipy scikit-learn catboost pyriemann
      - name: Download competition data
        run: |
          mkdir -p data output
          kaggle competitions download -c low-cost-motor-imagery-decoding-for-rehab -p data
      - name: Run model/blend validation and calculate OOF confusion matrix
        run: python scripts/nonlinear_v9.py
      - name: Search distinct EEG model and hyperparameter candidates
        run: python scripts/research_grid.py
      - name: Research filter-bank Riemannian tangent-space model
        run: python scripts/riemann_research.py
      - name: Build final candidate CSV from the best validated existing candidate (never submit)
        run: python scripts/submit_v9.py
      - name: Validate candidate and compare with 90% threshold
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          report = json.loads(Path("output/research_grid.json").read_text())
          best = report["best_candidate"]
          cm = {"matrix": best["confusion_matrix"], "labels": best["labels"], "oof_accuracy": best["accuracy"]}
          with open("output/submission.csv", newline="") as f:
              reader = csv.DictReader(f)
              assert reader.fieldnames == ["ID", "TARGET"]
              rows = list(reader)
          assert len(rows) == 680
          assert all(r["ID"] == str(i) and r["TARGET"] in {"move", "rest"} for i, r in enumerate(rows))
          score = float(cm["oof_accuracy"])
          print(f"VALIDATION_ACCURACY={score:.6%}")
          print(f"TARGET_STRICTLY_ABOVE_90={score > 0.90}")
          print("SELECTED_CONFIG=" + json.dumps({k: best[k] for k in ("rich_logistic_C", "catboost", "catboost_blend_weight")}))
          print("CONFUSION_MATRIX labels=[rest, move], rows=actual, columns=predicted")
          print(cm["matrix"])
          if Path("output/riemann_research.json").exists():
              rr = json.loads(Path("output/riemann_research.json").read_text())
              print(f"RIEMANN_VALIDATION_ACCURACY={rr['accuracy']:.6%}")
              print("RIEMANN_CONFUSION_MATRIX=" + json.dumps(rr["confusion_matrix"]))
          if score > 0.90:
              print("TARGET_REACHED: candidate is ready for human review only; no submission was made.")
          else:
              print("TARGET_NOT_REACHED: artifacts saved; compare new Riemannian candidate before next iteration.")
          print("KAGGLE_SUBMITTED=false")
          PY
      - name: Upload CSV and research metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eeg-research-loop-${{ github.run_id }}
          path: |
            output/submission.csv
            output/report.json
            output/nonlinear_v9.json
            output/research_grid.json
            output/riemann_research.json
          if-no-files-found: warn
          retention-days: 30
