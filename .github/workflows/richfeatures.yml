name: Validate narrow-band EEG features without submission
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/richfeatures.yml"
      - "scripts/richfeatures.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install kaggle numpy pandas scipy scikit-learn
      - run: |
          mkdir -p data
          kaggle competitions download -c low-cost-motor-imagery-decoding-for-rehab -p data
      - run: python scripts/richfeatures.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eeg-narrow-band-validation
          path: output/
          retention-days: 30
