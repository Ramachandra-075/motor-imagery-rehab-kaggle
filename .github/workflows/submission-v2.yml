name: Build improved EEG submission
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/submission-v2.yml"
      - "scripts/submit_v2.py"
      - "scripts/search.py"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install kaggle numpy pandas scipy scikit-learn
      - run: |
          mkdir -p data
          kaggle competitions download -c low-cost-motor-imagery-decoding-for-rehab -p data
      - run: python scripts/submit_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: improved-eeg-submission
          path: output/
          if-no-files-found: warn
          retention-days: 30
