name: Train EEG models and build submission
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/train.yml"
      - "scripts/train.py"
permissions:
  contents: read
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install kaggle numpy pandas scipy scikit-learn
      - name: Download competition dataset
        run: |
          mkdir -p data
          kaggle competitions download -c low-cost-motor-imagery-decoding-for-rehab -p data
      - name: Validate and train models
        run: python scripts/train.py
      - name: Upload submission and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eeg-submission
          path: output/
          if-no-files-found: warn
          retention-days: 30
